# Sanitized Phase 2 example. The HTTP server is available; no real providers exist.
# Omitted fields use defaults; local config.toml files are ignored by Git.
[storage]
data_dir = "./data"
state_dir = "./state"

[server]
loopback_address = "127.0.0.1"
port = 8787

[lan]
enabled = false
# Required when enabled, for example http://192.168.50.10:8787
public_origin = ""
listen_addresses = []
allow_networks = []

[remote]
enabled = false
public_origin = ""
direct_path = "/direct"
trusted_proxies = ["127.0.0.1/32"]

[http]
read_header_timeout = "5s"
read_timeout = "15s"
write_timeout = "30s"
idle_timeout = "60s"
resolve_timeout = "10s"
shutdown_timeout = "10s"
reload_interval = "5s"
max_header_bytes = 16384
max_connections = 128
resolver_concurrency = 8
playlist_per_minute = 30
resolve_per_minute = 60
rate_burst = 5
rate_max_clients = 1024
rate_client_ttl = "10m"

[refresh]
interval = "6h"
global_concurrency = 8
provider_concurrency = 3

[providers]
enabled = []

[relay]
enabled = false
